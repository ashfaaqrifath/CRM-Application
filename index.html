<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Application</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: light;
      --app-bg: #f5f7fb;
      --card-border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--app-bg);
      color: #111827;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.18);
      outline-offset: 2px;
    }

    .crm-card {
      border: 1px solid var(--card-border);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 30px rgba(15, 23, 42, 0.05);
    }

    .crm-input {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #fff;
      padding: 0.65rem 0.8rem;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .crm-input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      outline: none;
    }

    .crm-btn {
      border-radius: 8px;
      font-weight: 650;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .crm-btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .crm-btn:disabled {
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="js/apiService.js?v=3"></script>

  <script type="text/babel" src="js/components.js?v=3"></script>

  <script type="text/babel" src="js/app.js?v=3"></script>
</body>
</html>
